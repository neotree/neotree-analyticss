name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests, config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The real registry is a secret; the example proves app.config.ts (allowlist and flag checks) still resolves.
      - name: App config resolves
        run: npx expo config --json > /dev/null
        env:
          NEOTREE_COUNTRIES_FILE: config/countries.example.json
      - name: Dependency audit (high and critical)
        run: npm audit --omit=dev --audit-level=high

  android-native:
    name: Android native module compiles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          NEOTREE_COUNTRIES_FILE: config/countries.example.json
      - name: Compile the downloads / session module
        working-directory: android
        run: ./gradlew :neotree-downloads:compileReleaseKotlin --console=plain
